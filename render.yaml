services:
  - type: web
    name: namo-hotel-backend
    env: docker
    plan: free
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_DESTINATION_NUMBER
        sync: false
      - key: FRONTEND_URL
        sync: false
